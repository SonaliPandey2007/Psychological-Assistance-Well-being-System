<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAWS — Counsellor Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}
header{background:#172554;color:white;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:24px}header span{opacity:.85}
main{padding:25px;max-width:1250px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.card{background:white;border-radius:14px;padding:20px;box-shadow:0 3px 14px #00000010}
.card h3{margin:0 0 8px;font-size:14px;color:#64748b}.number{font-size:30px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:white;border-radius:14px;padding:20px;box-shadow:0 3px 14px #00000010;margin-bottom:20px}
.panel h2{margin-top:0;font-size:19px}
.alert,.victim{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin:10px 0;cursor:pointer}
.alert:hover,.victim:hover{background:#f8fafc}
.badge{display:inline-block;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:bold}
.high{background:#fee2e2;color:#991b1b}.moderate{background:#fef3c7;color:#92400e}.low{background:#dcfce7;color:#166534}
button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;background:#172554;color:white;margin-top:8px}
button:hover{opacity:.9}.muted{color:#64748b;font-size:13px}
#details{display:none}.row{display:flex;justify-content:space-between;gap:10px;margin:7px 0}
canvas{max-height:260px}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:8px}
@media(max-width:800px){.cards,.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div><h1>PAWS Counsellor Dashboard</h1><span>Psychological Assistance & Well-being System</span></div>
  <span id="userName">Counsellor</span>
</header>

<main>
<div class="cards">
  <div class="card"><h3>High Risk Alerts</h3><div class="number" id="highCount">0</div></div>
  <div class="card"><h3>Moderate Risk</h3><div class="number" id="moderateCount">0</div></div>
  <div class="card"><h3>Pending Alerts</h3><div class="number" id="pendingCount">0</div></div>
  <div class="card"><h3>Priority Victims</h3><div class="number" id="priorityCount">0</div></div>
</div>

<div id="error"></div>

<div class="grid">
<section class="panel">
<h2>Priority Victims</h2>
<div id="priorityList"><p class="muted">Loading...</p></div>
</section>

<section class="panel">
<h2>Alerts</h2>
<div id="alertList"><p class="muted">Loading...</p></div>
</section>
</div>

<section class="panel" id="details">
<h2>Victim Distress Profile</h2>
<div id="victimInfo"></div>
<canvas id="trendChart"></canvas>
<div id="history"></div>
</section>
</main>

<script>
const API = "http://127.0.0.1:5000";
let chart = null;

function getToken() {
  return localStorage.getItem("paws_token") ||
         localStorage.getItem("token") ||
         localStorage.getItem("jwtToken") ||
         localStorage.getItem("access_token");
}


// =========================================================
// LOAD COUNSELLOR DASHBOARD
// =========================================================

async function loadDashboard() {

  const token = getToken();

  if (!token) {
    document.getElementById("error").innerHTML =
      '<div class="error">Counsellor login token not found. Please log in again.</div>';
    return;
  }

  try {

    const response = await fetch(
      API + "/api/counsellor/dashboard",
      {
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Dashboard request failed"
      );
    }


    // =====================================================
    // CLEAR ERROR
    // =====================================================

    document.getElementById("error").innerHTML = "";


    // =====================================================
    // USER NAME
    // =====================================================

    if (data.user && data.user.name) {
      document.getElementById("userName").textContent =
        data.user.name;
    }


    // =====================================================
    // DATA
    // =====================================================

    const alerts =
      Array.isArray(data.alerts)
        ? data.alerts
        : [];

    const priority =
      Array.isArray(data.priority_victims)
        ? data.priority_victims
        : [];


    // =====================================================
    // CALCULATE COUNTS
    // =====================================================

    const highRisk =
      alerts.filter(a =>
        String(a.severity || "").toUpperCase() === "HIGH"
      );

    const moderateRisk =
      priority.filter(v =>
        String(v.risk_level || "").toUpperCase() === "MODERATE"
      );


    // =====================================================
    // UPDATE DASHBOARD CARDS
    // =====================================================

    document.getElementById("highCount").textContent =
      highRisk.length;

    document.getElementById("moderateCount").textContent =
      moderateRisk.length;

    document.getElementById("pendingCount").textContent =
      alerts.length;

    document.getElementById("priorityCount").textContent =
      priority.length;


    // =====================================================
    // RENDER SECTIONS
    // =====================================================

    renderAlerts(alerts);

    renderPriority(priority);

  }

  catch (err) {

    console.error("Dashboard error:", err);

    document.getElementById("error").innerHTML =
      '<div class="error">' +
      (err.message || "Could not load dashboard.") +
      '</div>';
  }
}


// =========================================================
// RENDER ALERTS
// =========================================================

function renderAlerts(alerts) {

  const box =
    document.getElementById("alertList");

  if (!alerts.length) {

    box.innerHTML =
      '<p class="muted">' +
      'No pending alerts. High-risk check-ins create alerts automatically.' +
      '</p>';

    return;
  }


  box.innerHTML = alerts.map(a => {

    const severity =
      String(a.severity || "LOW").toLowerCase();

    return `
      <div class="alert">

        <span class="badge ${severity}">
          ${a.severity || "LOW"}
        </span>

        <strong>
          Victim #${a.victim_id}
        </strong>

        <div class="muted">
          ${a.victim_code || ""}
        </div>

        <p>
          ${a.message ||
          "Distress-related signal requires counsellor review."}
        </p>

        <button
          onclick="reviewAlert(${a.alert_id})">
          Mark Reviewed
        </button>

      </div>
    `;

  }).join("");
}


// =========================================================
// RENDER PRIORITY VICTIMS
// =========================================================

function renderPriority(list) {

  const box =
    document.getElementById("priorityList");

  if (!list.length) {

    box.innerHTML =
      '<p class="muted">' +
      'No moderate/high-risk victims found.' +
      '</p>';

    return;
  }


  box.innerHTML = list.map(v => {

    const risk =
      String(v.risk_level || "LOW").toLowerCase();

    return `
      <div
        class="victim"
        onclick="loadVictim(${v.victim_id})">

        <span class="badge ${risk}">
          ${v.risk_level}
        </span>

        <strong>
          ${v.victim_code ||
          "Victim #" + v.victim_id}
        </strong>

        <div class="row">
          <span>Distress Index</span>
          <strong>
            ${v.distress_index}
          </strong>
        </div>

        <div class="muted">
          ${v.explanation ||
          "AI-assisted distress screening indicator"}
        </div>

      </div>
    `;

  }).join("");
}


// =========================================================
// MARK ALERT AS REVIEWED
// =========================================================

async function reviewAlert(id) {

  const token = getToken();

  try {

    const response = await fetch(
      API + "/api/counsellor/alerts/" + id + "/review",
      {
        method: "PUT",
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {

      alert(
        data.error ||
        "Could not review alert."
      );

      return;
    }


    // Refresh dashboard after review
    await loadDashboard();

  }

  catch (err) {

    alert(
      "Could not connect to PAWS backend."
    );

    console.error(err);
  }
}


// =========================================================
// LOAD VICTIM DISTRESS PROFILE
// =========================================================

async function loadVictim(id) {

  const token = getToken();

  try {

    const response = await fetch(
      API + "/api/counsellor/victims/" + id,
      {
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {

      alert(
        data.error ||
        "Could not load victim."
      );

      return;
    }


    // Show details section
    document.getElementById("details").style.display =
      "block";


    const latest =
      data.latest_distress;


    // =====================================================
    // VICTIM INFORMATION
    // =====================================================

    document.getElementById("victimInfo").innerHTML = `

      <div class="row">
        <span>Victim</span>
        <strong>
          ${data.victim.victim_code}
        </strong>
      </div>

      <div class="row">
        <span>Latest DDI</span>
        <strong>
          ${latest
            ? latest.distress_index
            : "—"}
        </strong>
      </div>

      <div class="row">
        <span>Risk Level</span>
        <strong>
          ${latest
            ? latest.risk_level
            : "—"}
        </strong>
      </div>

      <div class="row">
        <span>Trend</span>
        <strong>
          ${data.trend
            ? data.trend.direction
            : "—"}
        </strong>
      </div>

      <p>
        ${latest?.explanation ||
        "No AI explanation available yet."}
      </p>

    `;


    // =====================================================
    // DISTRESS HISTORY
    // =====================================================

    const history =
      data.distress_history || [];


    // =====================================================
    // CHART
    // =====================================================

    const canvas =
      document.getElementById("trendChart");

    if (chart) {
      chart.destroy();
    }


    chart = new Chart(
      canvas,
      {
        type: "line",

        data: {

          labels:
            history.map(
              x =>
                new Date(
                  x.created_at
                ).toLocaleDateString()
            ),

          datasets: [

            {
              label:
                "Distress Index",

              data:
                history.map(
                  x =>
                    Number(
                      x.distress_index
                    )
                ),

              tension: 0.3

            }

          ]
        },

        options: {

          responsive: true,

          scales: {

            y: {
              min: 0,
              max: 100
            }

          }

        }
      }
    );


    // =====================================================
    // HISTORY LIST
    // =====================================================

    document.getElementById("history").innerHTML =

      "<h3>Distress History</h3>" +

      history
        .slice()
        .reverse()
        .map(x => {

          const risk =
            String(
              x.risk_level || "LOW"
            ).toLowerCase();

          return `

            <div class="alert">

              <span class="badge ${risk}">
                ${x.risk_level}
              </span>

              <strong>
                DDI ${x.distress_index}
              </strong>

              <div class="muted">
                ${new Date(
                  x.created_at
                ).toLocaleString()}
              </div>

              <div>
                ${x.explanation || ""}
              </div>

            </div>

          `;

        })
        .join("");

  }

  catch (err) {

    console.error(
      "Victim profile error:",
      err
    );

    alert(
      "Could not load victim profile."
    );
  }
}


// =========================================================
// START DASHBOARD
// =========================================================

loadDashboard();

</script>
</body>
</html>
